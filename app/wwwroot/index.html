<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopia Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <div class="header-container">
            <div class="brand">
                <span class="brand-dot"></span>
                <h1>Kopia Monitor</h1>
            </div>
            <div class="header-actions">
                <span class="last-sync" id="last-sync-time">Sync: --:--:--</span>
                <button id="btnRunNow" class="btn-action" onclick="runChecksNow()">
                    <span id="btnIcon">↻</span>
                    <span id="btnText">Esegui Controlli Ora</span>
                </button>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="metrics-summary">
            <div class="metric-card">
                <span class="metric-label">Istanze Monitorate</span>
                <span class="metric-value" id="total-devices">0</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Stato Inserimento</span>
                <span class="metric-value" id="system-status">OK</span>
            </div>
        </div>

        <div class="section-title">Istanze Configurate</div>

        <div id="cardsContainer" class="cards-grid">
            <div class="empty-state">Caricamento stato del sistema...</div>
        </div>
    </main>

    <!-- MODALE CONFIGURAZIONE AVANZATA -->
    <div class="modal-overlay" id="settingsModal" style="display: none;">
      <div class="modal-dialog">
        <div class="modal-header">
          <h3 class="modal-title">Configurazione Istanza Kopia</h3>
          <button type="button" class="btn-close" onclick="closeSettingsModal()" title="Chiudi">✕</button>
        </div>
        <div class="modal-body">
          <form id="configForm">
            
            <div class="form-group">
              <label class="form-label">Verifica Normale (ogni X ore dall'ultima scansione):</label>
              <input type="number" id="normalInterval" class="form-control" value="24" min="1">
            </div>

            <div class="form-group">
              <label class="form-label">Verifica d'Integrità (ogni X ore dall'ultima):</label>
              <input type="number" id="integrityInterval" class="form-control" value="168" min="1">
            </div>

            <div class="form-group" style="margin-bottom: 25px;">
              <label class="form-label">Percentuale Verifica d'Integrità (%):</label>
              <input type="number" step="0.0001" id="verifyPercent" class="form-control" value="1" min="0" max="100">
            </div>

          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-action" onclick="closeSettingsModal()">Annulla</button>
          <button type="button" class="btn-action btn-save" onclick="saveAdvancedConfig()">Salva e Invia</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
