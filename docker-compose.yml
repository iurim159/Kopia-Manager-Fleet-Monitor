services:
  # 1. Broker MQTT EMQX
  emqx:
    image: emqx/emqx:5.3.0
    container_name: jdoctor-emqx
    restart: always
    ports:
      - "1883:1883"
      - "18083:18083"

  # 2. Istanza Kopia
  kopia-ui:
    image: kopia/kopia:latest
    container_name: kopia-iso-tn-01-kopia
    restart: always
    ports:
      - "5115:5115"
    command:
      - server
      - start
      - --insecure
      - --address=0.0.0.0:5115
      - --password=-password
      - --without-password
      - --allow-extremely-dangerous-unauthenticated-server-on-the-network
    volumes:
      - ./config:/app/config
      - ./cache:/app/cache
      - ./logs:/var/log

  # 3. La tua Dashboard .NET
  kopia-monitor-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jdoctor-kopia-monitor
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MQTT__Host=emqx
      - MQTT__Port=1883
    volumes:
      - ./logs:/app/logs
      - ./app/appsettings.json:/app/appsettings.json
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - emqx
      - kopia-ui

  # 4. PRIMO AGENT (Ubuntu + Cron + Mosquitto + Docker CLI)
  kopia-monitor-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: jdoctor-kopia-agent
    restart: always
    environment:
      - MQTT_HOST=emqx
      - AGENT_ID=AGENT_01
    volumes:
      - ./agent/kopia-weekly-maintenance.sh:/app/kopia-weekly-maintenance.sh
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - emqx

  # 5. SECONDO AGENT
  kopia-monitor-agent2:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: jdoctor-kopia-agent2
    restart: always
    environment:
      - MQTT_HOST=emqx
      - AGENT_ID=AGENT_02
    volumes:
      - ./agent/kopia-weekly-maintenance.sh:/app/kopia-weekly-maintenance.sh
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - emqx